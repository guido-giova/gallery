services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gallery"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gallery
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_PATH: /app/uploads
      LOG_PATH: /app/logs
    ports:
      - "8081:8081"
    volumes:
      - ${STORAGE_PATH:?Set STORAGE_PATH in .env}:/app/uploads
      - ${LOG_PATH:?Set LOG_PATH in .env}:/app/logs

  web:
    build: ../gallery-ui
    ports:
      - "8082:80"
    depends_on:
      - app

volumes:
  pgdata:
