spring.application.name=gallery

server.port=${PORT:8081}
app.cors.allowed=http://localhost:8082

app.storage.path=${STORAGE_PATH:uploads}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.datasource.url=jdbc:postgresql://localhost:5432/gallery
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Logging
logging.level.root=INFO
logging.level.com.gallery=DEBUG
logging.file.name=${LOG_PATH:logs}/gallery.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
